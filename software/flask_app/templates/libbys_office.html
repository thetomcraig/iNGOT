<html>
  <head>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="Libbys Office" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>Libbys Office</title>
    <link
      rel="stylesheet"
      href="/static/libbys_office.css?v=20260706-room"
    />
  </head>
  <body>
    <img
      class="hero-image"
      src="/static/ios/background.png?v=20260614-test"
      alt=""
    />
    <iframe name="sink" style="visibility:hidden;width:0;height:0;border:0;position:absolute"></iframe>
    <main class="panel">
      <table class="button-grid" cellpadding="0" cellspacing="0" border="0">
        <tr>
          <td>
            <form action="/libbys_office_lights_toggle" method="post" target="sink">
              <button class="image-button" type="submit">
                <img
                  src="/static/ios/lamp_purple.png"
                  alt="Libbys Office Lights Toggle"
                />
                <span class="icon-label">Lamp</span>
              </button>
            </form>
          </td>
          <td>
            <form action="/vacuum_start" method="post" target="sink">
              <button class="image-button" type="submit">
                <img
                  src="/static/ios/vacuum_start.png"
                  alt="Start Vacuum"
                />
                <span class="icon-label">Start Rocky</span>
              </button>
            </form>
          </td>
          <td>
            <form action="/vacuum_stop" method="post" target="sink">
              <button class="image-button" type="submit">
                <img
                  src="/static/ios/vacuum_stop.png"
                  alt="Stop Vacuum"
                />
                <span class="icon-label">Stop Rocky</span>
              </button>
            </form>
          </td>
        </tr>
        <tr>
          <td>
            <span class="temp-tile">
              <img
                src="/static/ios/blank_ios_weather_blue.png"
                alt="Eloise's Temperature"
              />
              <span class="temp-value" id="eloises-temp">
                <span class="temp-reading">
                  <span class="temp-number" id="eloises-temp-number"></span>
                  <span class="temp-degree">°</span>
                </span>
              </span>
            </span>
            <span class="icon-label">Eloise</span>
          </td>
          <td>
            <span class="temp-tile">
              <img
                src="/static/ios/blank_nord2.png"
                alt="Outside Temperature"
              />
              <span class="temp-value" id="outside-temp">
                <span class="temp-reading">
                  <span class="temp-number" id="outside-temp-number"></span>
                  <span class="temp-degree">°</span>
                </span>
              </span>
            </span>
            <span class="icon-label">Outside</span>
          </td>
          <td>
            <form action="/downstairs_toggle" method="post" target="sink">
              <button class="image-button" type="submit">
                <img
                  src="/static/ios/light_bulb_house.png"
                  alt="Downstairs Lights Toggle"
                />
                <span class="icon-label">Lights</span>
              </button>
            </form>
          </td>
        </tr>
      </table>
    </main>
    <script>
      (function () {
        var tempTiles = [
          {
            number: document.getElementById("eloises-temp-number"),
            url: "/eloises_temp"
          },
          {
            number: document.getElementById("outside-temp-number"),
            url: "/outside_temp"
          }
        ];
        var refreshIntervalMs = 10 * 60 * 1000;
        var tempRequests = {};

        function refreshTemp(tile) {
          var tempRequest = tempRequests[tile.url];

          if (tempRequest && tempRequest.readyState !== 4) {
            return;
          }

          tempRequest = new XMLHttpRequest();
          tempRequests[tile.url] = tempRequest;
          tempRequest.onreadystatechange = function () {
            if (tempRequest.readyState === 4 && tempRequest.status === 200) {
              tile.number.textContent = tempRequest.responseText.replace("°", "").trim();
            }
          };
          tempRequest.open("GET", tile.url + "?t=" + Date.now(), true);
          tempRequest.send();
        }

        function refreshTemps() {
          tempTiles.forEach(refreshTemp);
        }

        refreshTemps();
        window.setInterval(refreshTemps, refreshIntervalMs);

        var refreshPage = document.getElementById("refresh-page");
        if (refreshPage) {
          refreshPage.addEventListener("click", function () {
            window.setTimeout(function () {
              window.location.reload();
            }, 180);
          });
        }
      })();
    </script>
    <script src="/static/press_feedback.js?v=20260706-ios3"></script>
  </body>
</html>
