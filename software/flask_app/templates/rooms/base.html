<html>
  <head>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="Living Room" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
  </head>
  <body>
    <img
      class="hero-image"
      src="/static/ios/background.png?v=20260614-test"
      alt=""
    />
    <iframe
      name="sink"
      style="
        visibility: hidden;
        width: 0;
        height: 0;
        border: 0;
        position: absolute;
      "
    ></iframe>
    <main class="panel">
    <table class="button-grid" cellpadding="0" cellspacing="0" border="0">
      {% block content %}
      {% endblock %}
    </table>
    {% block modals %}
    {% endblock %}
    <div id="modal-backdrop" class="modal-backdrop" style="display: none"></div>
    <script src="{{ url_for('static', filename='scripts/modal.js') }}"></script>
    <script src="{{ url_for('static', filename='scripts/press_feedback.js') }}"></script>
    <script src="{{ url_for('static', filename='scripts/weather.js') }}"></script>
    <script src="{{ url_for('static', filename='scripts/page_refresh.js') }}"></script>
    <script>
      window.homeAssistantStates = {{ home_assistant_states | tojson }};
    </script>
    <script src="{{ url_for('static', filename='scripts/home_assistant_state_manager.js') }}"></script>
    <script>
      var startX, startY;
var moved = false;

document.addEventListener("touchstart", function(e) {
    startX = e.touches[0].clientX;
    startY = e.touches[0].clientY;
    moved = false;
}, false);

document.addEventListener("touchmove", function(e) {
    var dx = e.touches[0].clientX - startX;
    var dy = e.touches[0].clientY - startY;

    if (Math.abs(dx) > 5 || Math.abs(dy) > 5) {
        moved = true;
        e.preventDefault();
    }
}, false);
    </script>
    </main>
  </body>
</html>
