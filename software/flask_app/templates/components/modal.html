<div id="modal-backdrop" class="modal-backdrop" style="display: none"></div>
<div id="modal" class="modal" style="display: none">
  <div class="modal-highlight-top"></div>
  <h2>{{ modal_title }}</h2>
  <p>{{ modal_message }}</p>
  <div class="modal-buttons">
    <button id="modal-cancel" type="button">{{ modal_cancel_text }}</button>
    <button id="modal-confirm" type="button">{{ modal_confirm_text }}</button>
  </div>
</div>
<form
  id="modal-form"
  action="{{ modal_confirm_action }}"
  method="post"
  target="sink"
  style="display: none"
></form>
