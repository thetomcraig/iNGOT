{% macro api_call_button(action, img, alt_text, label_text, class_name="", entity_id="") %}
<form action="{{ action }}" method="post" target="sink">
  <button class="image-button" type="submit">
    <img
      src="{{ img }}"
      alt="{{ alt_text }}"
      class="{{ class_name }}"
      {% if entity_id %}data-ha-entity="{{ entity_id }}"{% endif %}
    >
    <span class="icon-label">{{ label_text }}</span>
  </button>
</form>
{% endmacro %}
