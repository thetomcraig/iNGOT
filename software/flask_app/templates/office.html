<html>
  <head>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="Living Room" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>Office</title>
    <link
      rel="stylesheet"
      href="/static/office.css?v=20260708-labels"
    />
  </head>
  <body>
    <img
      class="hero-image"
      src="/static/ios/background.png?v=20260614-test"
      alt=""
    />
    <iframe name="sink" style="visibility:hidden;width:0;height:0;border:0;position:absolute"></iframe>
    <main class="panel">
      <table class="button-grid" cellpadding="0" cellspacing="0" border="0">
        <tr>
          <td>
            <form action="/office_lamps_toggle" method="post" target="sink">
              <button class="image-button" type="submit">
                <img
                  src="/static/ios/lamp.png"
                  alt="Office Lamps Toggle"
                />
                <span class="icon-label">Lamps</span>
              </button>
            </form>
          </td>
          <td>
            <form action="/office_fans_lights_toggle" method="post" target="sink">
              <button class="image-button" type="submit">
                <img
                  src="/static/ios/ceiling_light.png"
                  alt="Office Fan Lights Toggle"
                />
                <span class="icon-label">Overhead</span>
              </button>
            </form>
          </td>
          <td>
            <form action="/TODO" method="post" target="sink">
              <button class="image-button" type="submit">
                <img
                  src="/static/ios/fan.png"
                  alt="TODO"
                />
                <span class="icon-label">Fans</span>
              </button>
            </form>
          </td>
        </tr>
        <tr>
          <td>
            <form action="/office_ceiling_lights_toggle" method="post" target="sink">
              <button class="image-button" type="submit">
                <img
                  src="/static/ios/light_bulb_peg_board.png"
                  alt="Office Ceiling Lights Toggle"
                />
                <span class="icon-label">Workshop</span>
              </button>
            </form>
          </td>
          <td>
            <form action="/3d_printer_toggle" method="post" target="sink">
              <button class="image-button" type="submit">
                <img
                  src="/static/ios/3d_printer.png"
                  alt="3D Printer Toggle"
                />
                <span class="icon-label">Printer</span>
              </button>
            </form>
          </td>
          <td>
            <button id="all-lights-button" class="image-button" type="button">
              <img
                src="/static/ios/light_bulb_attic.png"
                alt="Office Lights Off"
              />
              <span class="icon-label">All Lights Off</span>
            </button>
          </td>
        </tr>
      </table>
    </main>
    <div id="modal-backdrop" class="modal-backdrop" style="display:none;"></div>
    <div id="all-lights-modal" class="modal" style="display:none;">
      <h2>Turn Off Lights</h2>

      <button id="modal-all-lights">All Office Lights</button>

      <button id="modal-cancel">Cancel</button>
    </div>
    <script src="/static/press_feedback.js?v=20260706-ios3"></script>
    <form
      id="all-lights-form"
      action="/office_lights_off"
      method="post"
      target="sink"
      style="display:none"
    ></form>
  </body>
</html>
